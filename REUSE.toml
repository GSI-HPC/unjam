# The docs site: pages (front matter must come first), JSON (npm manifests, terminal recordings)
# and images cannot carry a header.
[[annotations]]
path = ["site/package.json", "site/package-lock.json", "site/src/content/**", "site/src/data/**", "site/src/assets/**", "site/public/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "© GSI Helmholtzzentrum f. Schwerionenforschung GmbH, Darmstadt, Germany"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# A subset of JetBrains Mono 2.304 (box-drawing, block, arrow and braille glyphs); see
# site/src/styles/fonts.css for how it was made.
[[annotations]]
path = "site/src/fonts/jetbrains-mono-symbols.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"
