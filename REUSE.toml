version = 1

[[annotations]]
path = "Cargo.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "© GSI Helmholtzzentrum f. Schwerionenforschung GmbH, Darmstadt, Germany"
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["tests/fixtures/**", ".claude/**", "pkg/rpm/RPM-GPG-KEY-unjam"]
precedence = "aggregate"
SPDX-FileCopyrightText = "© GSI Helmholtzzentrum f. Schwerionenforschung GmbH, Darmstadt, Germany"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# The docs site: pages (front matter must come first), JSON (npm manifests, terminal recordings)
# and images cannot carry a header.
[[annotations]]
path = ["site/package.json", "site/package-lock.json", "site/src/content/**", "site/src/data/**", "site/src/assets/**", "site/public/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "© GSI Helmholtzzentrum f. Schwerionenforschung GmbH, Darmstadt, Germany"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# The site's fonts, cut from the upstream releases by site/scripts/fonts.sh.
[[annotations]]
path = ["site/src/fonts/inter.woff2", "site/src/fonts/inter-italic.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/src/fonts/jetbrains-mono.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"
