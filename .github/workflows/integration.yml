name: Integration

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  sind:
    name: sind (Slurm ${{ matrix.slurm }}${{ matrix.extra && ', io+pids' || '' }}${{ matrix.jobidpaths && ', JobIdPaths' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 25.11 as a default site leaves it: no io and pids controllers in job cgroups.
          - slurm: "25.11"
          # 26.05 default: SLUID job directories.
          - slurm: "26.05"
            extra: "yes"
          # 26.05 with job_<id> directories.
          - slurm: "26.05"
            extra: "yes"
            jobidpaths: "yes"
    env:
      # One realm: each matrix job has its own runner and Docker daemon (sind guides/ci-cd.md).
      SIND_REALM: unjam-it
      SIND_PROGRESS: plain
      SIND_PROGRESS_LOG: ${{ github.workspace }}/sind-events.jsonl
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      SLURM: ${{ matrix.slurm }}
      EXTRA: ${{ matrix.extra }}
      JOBIDPATHS: ${{ matrix.jobidpaths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
        with:
          # uv for IT 6/7 (pyarrow); everything else the tests need is on the runner.
          install_args: pipx:uv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      # Static binary: the Rocky Linux node images may have an older glibc than the runner.
      - run: mise run build:musl
      - run: mise run it:cluster
      - uses: GSI-HPC/sind-action@d91e0e13e9c63bcce0b83ce7d61674954d7ae2d7  # v2.2.0
        with:
          version: v0.15.0
          wait: 10m
          realm: ${{ env.SIND_REALM }}
          clusters: |
            - ${{ github.workspace }}/target/sind-cluster.yaml
      - run: mise run it:test
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sind-${{ strategy.job-index }}
          path: |
            target/sind-*
            sind-events.jsonl
          if-no-files-found: ignore
