name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    if: github.repository == 'GSI-HPC/unjam'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - name: Tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
      - name: CHANGELOG has a section for the version
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > /dev/null

  checks:
    needs: verify
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/checks.yml

  integration:
    needs: verify
    uses: ./.github/workflows/integration.yml

  binaries:
    name: Static binary (${{ matrix.arch }})
    needs: [checks, integration]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Ensure rustup
        run: |
          command -v rustup >/dev/null || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          }
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise run build:musl
      - run: cp "target/${{ matrix.target }}/release/unjam" "unjam-linux-${{ matrix.arch }}"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: unjam-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: unjam-linux-${{ matrix.arch }}
          path: unjam-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: unjam-linux-*
          merge-multiple: true
      - run: sha256sum unjam-linux-amd64 unjam-linux-arm64 > checksums.txt
      - name: Create the draft release with the binaries
        run: |
          scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            unjam-linux-amd64 unjam-linux-arm64 checksums.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag \
            --draft --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  # crates.io cannot be undone: publish last, after the environment's reviewer approves.
  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
