name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    if: github.repository == 'GSI-HPC/unjam'
    uses: ./.github/workflows/checks.yml

  integration:
    if: github.repository == 'GSI-HPC/unjam'
    uses: ./.github/workflows/integration.yml

  publish:
    name: Publish to crates.io
    if: github.repository == 'GSI-HPC/unjam'
    needs: [checks, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    name: Static binary (${{ matrix.arch }})
    if: github.repository == 'GSI-HPC/unjam'
    needs: [checks, integration]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Ensure rustup
        run: |
          command -v rustup >/dev/null || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          }
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise run build:musl
      - run: cp "target/${{ matrix.target }}/release/unjam" "unjam-linux-${{ matrix.arch }}"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: unjam-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: unjam-linux-${{ matrix.arch }}
          path: unjam-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.repository == 'GSI-HPC/unjam'
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: unjam-linux-*
          merge-multiple: true
      - run: sha256sum unjam-linux-amd64 unjam-linux-arm64 > checksums.txt
      - name: Create the release with the binaries
        run: >
          gh release create "$GITHUB_REF_NAME"
          unjam-linux-amd64 unjam-linux-arm64 checksums.txt
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
