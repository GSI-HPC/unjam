name: Checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Every job runs the same `mise run` task as a local check and installs only the tools it needs.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  reuse:
    name: REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          install_args: pipx:reuse
      - run: mise run reuse

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise run fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          install_args: cargo:clippy-sarif cargo:sarif-fmt
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: mise run lint:sarif
      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clippy-results.sarif
          wait-for-processing: true
        if: always()

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run test

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run msrv

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          install_args: cargo:cargo-deny
      - run: mise run deny

  size:
    name: Size and unsafe ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run size
      - run: mise run size:self-test
      - run: mise run unsafe-deps
      - run: mise run unsafe-deps:self-test
